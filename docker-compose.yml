# Ports and URLs are configurable through a project-root `.env` (Compose reads it automatically;
# see .env.example) or shell variables. Nothing is baked into the images, so changing
# BACKEND_PORT / FRONTEND_PORT never requires a rebuild.
services:
  backend:
    build: ./backend
    container_name: netmedic-backend
    environment:
      NETMEDIC_CORS_ORIGINS: ${NETMEDIC_CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}}
      # LAN demos (phone, second laptop) need more than localhost, but the API has no auth,
      # so this is limited to loopback/private/.local hosts on the dashboard port rather than
      # any host - a page served on that port from the public internet must not drive it.
      NETMEDIC_CORS_ORIGIN_REGEX: '${NETMEDIC_CORS_ORIGIN_REGEX:-https?://(localhost|\[::1\]|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|[A-Za-z0-9-]+\.local):${FRONTEND_PORT:-3000}}'
      NETMEDIC_TICK_SECONDS: ${NETMEDIC_TICK_SECONDS:-1.5}
      NETMEDIC_AI_PROVIDER: ${NETMEDIC_AI_PROVIDER:-mock}
      QUALCOMM_AI_BASE_URL: ${QUALCOMM_AI_BASE_URL:-}
      QUALCOMM_AI_API_KEY: ${QUALCOMM_AI_API_KEY:-}
      QUALCOMM_AI_MODEL: ${QUALCOMM_AI_MODEL:-}
    volumes:
      - netmedic-data:/app/data   # SQLite database + trained model persist across restarts
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s   # first boot trains the Isolation Forest (10-20 s)

  frontend:
    build: ./frontend
    container_name: netmedic-frontend
    environment:
      # Read at runtime by /api/config. The browser derives the backend address from its own
      # location plus this port; set the *_URL values only when the API lives on another host.
      NETMEDIC_BACKEND_PORT: ${BACKEND_PORT:-8000}
      NETMEDIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      NETMEDIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  netmedic-data:
